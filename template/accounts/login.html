{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Cédula / RIF</label>
            {{ form.username }}
        </div>
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700">Password</label>
            {{ form.password }}
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition">Login</button>
    </form>
    <p class="mt-4 text-center text-sm">Don't have an account? <a href="{% url 'register' %}" class="text-indigo-600 hover:underline">Register here</a></p>
</div>
{% endblock %}
