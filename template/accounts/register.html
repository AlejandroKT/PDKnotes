<!-- templates/accounts/register.html -->
{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center">Register Supplier</h2>
    <form method="post">
        {% csrf_token %}
        
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Cédula / RIF</label>
            {{ form.document_id }}
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">First Name</label>
            {{ form.first_name }}
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Password</label>
            {{ form.password1 }}
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
            {{ form.password2 }}
        </div>

        <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition">Register</button>
    </form>
    <p class="mt-4 text-center text-sm">Already have an account? <a href="{% url 'login' %}" class="text-indigo-600 hover:underline">Login here</a></p>
</div>
{% endblock %}
