{% extends 'base.html' %}
{% block content %}
<div class="bg-white shadow overflow-hidden sm:rounded-lg max-w-3xl mx-auto">
    <div class="px-4 py-5 sm:px-6 flex justify-between items-center">
        <h3 class="text-lg leading-6 font-medium text-gray-900">{{ note.title }}</h3>
        <div class="flex space-x-2">
            <a href="{% url 'note_edit' note.pk %}" class="text-indigo-600 hover:text-indigo-900">Editar</a>
            <a href="{% url 'note_delete' note.pk %}" class="text-red-600 hover:text-red-900">Eliminar</a>
        </div>
    </div>
    <div class="border-t border-gray-200 px-4 py-5 sm:p-0">
            <div class="py-4 sm:py-5 sm:px-6">
                <p class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">{{ note.content }}</p>
            </div>
    </div>
</div>
{% endblock %}
